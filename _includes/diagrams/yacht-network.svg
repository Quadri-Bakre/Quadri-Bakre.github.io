<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Space Mono, monospace" role="img" aria-label="Simplified network diagram: two satellite WAN links into a failover router, a Layer 3 core switch carrying the Home, Guest, AV-over-IP and Crestron NAX VLANs, then AV, rack and cabin switches feeding audio streamers, Dante amplifiers, the control processor and access points.">
  <rect width="800" height="600" fill="#161b22"/>
  <style>
    .box{fill:#21262d;stroke:#00FFCC;stroke-width:1.5}
    .t{fill:#e6edf3;font-size:13px;font-weight:700;text-anchor:middle}
    .s{fill:#8b949e;font-size:11px;text-anchor:middle}
    .c{font-size:10px;font-weight:700;text-anchor:middle;fill:#161b22}
    .l{stroke:#00FFCC;stroke-width:1.5;fill:none}
    .d{stroke:#8b949e;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
  </style>
  <rect class="box" x="150" y="20" width="200" height="50" rx="4"/><text class="t" x="250" y="42">SATELLITE WAN 1</text><text class="s" x="250" y="60">land service</text>
  <rect class="box" x="450" y="20" width="200" height="50" rx="4"/><text class="t" x="550" y="42">SATELLITE WAN 2</text><text class="s" x="550" y="60">marine service</text>
  <path class="l" d="M250 70 V100 H400"/><path class="d" d="M550 70 V100 H400"/>
  <rect class="box" x="300" y="110" width="200" height="50" rx="4"/><text class="t" x="400" y="132">FAILOVER ROUTER</text><text class="s" x="400" y="150">dual WAN</text>
  <path class="l" d="M400 160 V190"/>
  <rect class="box" x="220" y="190" width="360" height="90" rx="4"/><text class="t" x="400" y="214">LAYER 3 CORE SWITCH</text><text class="s" x="400" y="232">inter-VLAN routing · DHCP · root bridge</text>
  <rect x="232" y="246" width="76" height="22" rx="11" fill="#00FFCC"/><text class="c" x="270" y="261">HOME</text>
  <rect x="314" y="246" width="76" height="22" rx="11" fill="#f0b429"/><text class="c" x="352" y="261">GUEST</text>
  <rect x="396" y="246" width="84" height="22" rx="11" fill="#58a6ff"/><text class="c" x="438" y="261">AV-OVER-IP</text>
  <rect x="484" y="246" width="90" height="22" rx="11" fill="#d2a8ff"/><text class="c" x="529" y="261">CRESTRON NAX</text>
  <path class="l" d="M400 280 V310 M110 310 H690 M110 310 V330 M400 310 V330 M690 310 V330"/>
  <rect class="box" x="20" y="330" width="180" height="62" rx="4"/><text class="t" x="110" y="352">AV SWITCH</text><text class="s" x="110" y="368">multicast · QoS · PTP</text>
  <rect x="34" y="374" width="72" height="14" rx="7" fill="#58a6ff"/><rect x="112" y="374" width="74" height="14" rx="7" fill="#d2a8ff"/>
  <rect class="box" x="310" y="330" width="180" height="62" rx="4"/><text class="t" x="400" y="352">RACK SWITCH</text><text class="s" x="400" y="368">control · TV</text>
  <rect x="364" y="374" width="72" height="14" rx="7" fill="#00FFCC"/>
  <rect class="box" x="600" y="330" width="180" height="62" rx="4"/><text class="t" x="690" y="352">8 × CABIN SWITCHES</text><text class="s" x="690" y="368">PoE edge · trunk</text>
  <rect x="616" y="374" width="72" height="14" rx="7" fill="#00FFCC"/><rect x="694" y="374" width="72" height="14" rx="7" fill="#f0b429"/>
  <path class="l" d="M60 392 V440 M165 392 V440 M400 392 V440 M690 392 V440"/>
  <rect class="box" x="10" y="440" width="100" height="70" rx="4"/><text class="t" x="60" y="464">4 × AUDIO</text><text class="s" x="60" y="480">streamers</text>
  <rect x="24" y="490" width="72" height="12" rx="6" fill="#d2a8ff"/>
  <rect class="box" x="115" y="440" width="100" height="70" rx="4"/><text class="t" x="165" y="464">8 × DANTE</text><text class="s" x="165" y="480">amplifiers</text>
  <rect x="129" y="490" width="72" height="12" rx="6" fill="#58a6ff"/>
  <rect class="box" x="310" y="440" width="180" height="70" rx="4"/><text class="t" x="400" y="464">CONTROL PROCESSOR</text><text class="s" x="400" y="480">and TV sources</text>
  <rect x="364" y="490" width="72" height="12" rx="6" fill="#00FFCC"/>
  <rect class="box" x="600" y="440" width="180" height="70" rx="4"/><text class="t" x="690" y="464">9 × ACCESS POINTS</text><text class="s" x="690" y="480">owner and guest Wi-Fi</text>
  <rect x="616" y="490" width="72" height="12" rx="6" fill="#00FFCC"/><rect x="694" y="490" width="72" height="12" rx="6" fill="#f0b429"/>
  <path class="l" d="M200 565 H240"/><text class="s" x="280" y="569">primary</text>
  <path class="d" d="M350 565 H390"/><text class="s" x="430" y="569">failover</text>
  <text class="s" x="610" y="569">colour = VLAN</text>
</svg>
