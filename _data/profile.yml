about_text: >-
  I'm a network and AV systems engineer with ten years of hands-on experience in the
  UK and Nigeria. At Equippd I work on high-end residential properties and private yachts,
  designing how the network and systems work together, then configuring, programming
  and commissioning both the network and the AV and control systems, and handing over
  with as-built records and configuration backups. Before moving to the UK I spent seven
  years in Lagos installing, building and commissioning AV, control and network systems
  for homes, hotels and conference facilities.

